# frame-ship — mise toolchain
# Install: mise install | Trust: mise trust

[tools]
node = "22"

[tasks.typecheck]
description = "Typecheck opencode plugin (zero-deps, single file)"
run = 'npx -y -p typescript tsc --noEmit --skipLibCheck --module nodenext --target es2022 --moduleResolution nodenext plugins/opencode/frame-ship.ts'

[tasks.install]
description = "Install opencode plugin deps"
run = "npm install"

[settings]
experimental = true
