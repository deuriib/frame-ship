# frame-ship — mise toolchain
# Install: mise install | Trust: mise trust

[tools]
node = "22"

[tasks.typecheck]
description = "Typecheck opencode plugins (zero-deps; skills + agents + shared + composed entry)"
run = 'npx -y -p typescript tsc --noEmit --skipLibCheck --module esnext --target es2022 --moduleResolution bundler plugins/opencode/frame-ship.ts plugins/opencode/skills.ts plugins/opencode/agents.ts plugins/opencode/guardrails.ts plugins/opencode/shared.ts'

[tasks.install]
description = "Install opencode plugin deps"
run = "npm install"

[tasks.bump]
description = "Synchronize or bump versions across all project files"
run = "node scripts/bump-version.mjs"

[tasks.version-check]
description = "Check for version drift across all project files"
run = "node scripts/bump-version.mjs --check"

[settings]
experimental = true
